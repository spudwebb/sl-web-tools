<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="Description"
      content="HomeSeer SmartStick ZB firmware flasher"
    />
    <base href="/" />

    <title>HomeSeer Zigbee Flasher</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        background-color: #ededed;

        font-family: 'Segoe UI', Roboto, sans-serif;

        --mdc-theme-primary: #03a9f4;
      }

      img {
        vertical-align: middle;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        font-size: 1em;

        padding: 5em;

        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }
    </style>
  </head>

  <body>
    <main>
	 <h1>HomeSeer SmartStick ZB  Flasher</h1>
      <img
          src="https://homeseer.com/wp-content/uploads/2025/06/Zig-bee-1-768x538.png"
          alt="SmartStick ZB" width="500px"
      />

      <p>To get started, plug your SmartStick ZB into this computer.</p>

      <nabucasa-zigbee-flasher manifest="./assets/manifests/smartstickzb.json">
        <span slot="button">Connect</span>
      </nabucasa-zigbee-flasher>
    </main>

    <script module>
      import('./dist/web/nabucasa-zigbee-flasher.js');
    </script>
  </body>
</html>
